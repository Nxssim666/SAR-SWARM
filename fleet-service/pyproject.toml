[project]
name = "fleet-service"
version = "0.1.0"
description = "Ground fleet service for civilian search-and-rescue drone operations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "contourpy>=1.3",
    "fastapi>=0.135",
    "mavsdk>=4.0",
    "nats-py>=2.16",
    "numpy>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyproj>=3.7",
    "shapely>=2.1",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn>=0.35",
    "websockets>=15",
]

[project.scripts]
fleet-service = "fleet_service.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx-ws>=0.7",
    "hypothesis>=6.130",
    "mypy>=1.17",
    "pymavlink>=2.4.50",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pyyaml>=6",
    "ruff>=0.12",
    "schemathesis>=4.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-shapely>=2.1.0.20260728",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_service"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "C4", "DTZ", "PIE", "PT", "RET",
    "SIM", "T20", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The command line talks to its user through stdout.
"src/fleet_service/cli.py" = ["T201"]
"scripts/**" = ["T201"]
# HTTP-semantic names (NotFound, Conflict, ...) read better than *Error at raise sites.
"src/fleet_service/errors.py" = ["N818"]
# Autogenerated migrations keep Alembic's layout.
"src/fleet_service/db/migrations/*/versions/*.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src,tests,../sim,../src/sar_gcs_bridge"
files = ["src", "tests", "scripts", "../sim", "../fleet-console/e2e"]
# sim/swarm runs with the onboard package (ROS style, untyped): linted, not type-checked.
exclude = ['sim[\\/]swarm[\\/]']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Untyped third-party packages: MAVSDK (ctypes binding) and pymavlink (tests only).
module = ["mavsdk.*", "pymavlink.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../sim", "../src/sar_gcs_bridge"]
markers = [
    "sitl: needs the PX4 SITL fleet of sim/sitl/compose.yaml; runs with SARGCS_SITL=1",
    "sitl_scale: needs a generated PX4 SIH fleet (sim/sitl/fleet.py); runs with SARGCS_SCALE_FLEET",
    "swarm: needs the swarm of sim/swarm/compose.yaml (bridge, NATS); runs with SARGCS_SWARM=1",
    "video: needs the mock video relay of sim/video/compose.yaml; runs with SARGCS_VIDEO=1",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # Schemathesis' ASGI lifespan helper never closes its anyio memory streams (third-party).
    "ignore:.*MemoryObject(Send|Receive)Stream:ResourceWarning",
    "ignore:.*MemoryObject(Send|Receive)Stream:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff.lint.isort]
known-local-folder = ["support", "factories"]
