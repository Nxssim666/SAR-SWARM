# The fleet service against PX4 itself (ADR 0023): five PX4 SIH instances in containers,
# the SITL integration tests over real MAVLink, logs kept as artifacts.
name: sitl

on:
  push:
    branches: [main, "exp/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitl:
    name: PX4 SITL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fleet-service
    steps:
      - uses: actions/checkout@v5
      - name: Start the PX4 fleet
        working-directory: .
        run: |
          docker compose -f sim/sitl/compose.yaml pull --quiet
          docker compose -f sim/sitl/compose.yaml up -d
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Tracking measurement at 5 aircraft (ADR 0026; before the flights)
        env:
          SARGCS_SCALE_FLEET: ../sim/sitl/generated/fleet.json
          SARGCS_SCALE_REPORT: ../sitl-results/scale-report.json
          SARGCS_SCALE_WINDOW_S: "30"
        run: |
          uv run python ../sim/sitl/fleet.py --count 5 --out ../sim/sitl/generated
          uv run pytest -m sitl_scale tests/integration/test_scale.py -k tracked -v \
            -p no:cacheprovider --junitxml=../sitl-results/junit-scale.xml
      - name: Integration tests
        env:
          SARGCS_SITL: "1"
        run: >
          uv run pytest -m sitl tests/integration -v -p no:cacheprovider
          --junitxml=../sitl-results/junit.xml -o log_cli=true -o log_cli_level=WARNING
      - name: Collect PX4 logs
        if: always()
        working-directory: .
        run: |
          mkdir -p sitl-results
          docker compose -f sim/sitl/compose.yaml ps -a > sitl-results/containers.txt
          docker compose -f sim/sitl/compose.yaml logs --no-color --timestamps > sitl-results/px4.log
      - name: Report results as annotations (readable without signing in)
        if: always()
        working-directory: .
        run: python3 sim/sitl/annotate.py sitl-results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sitl-results
          path: sitl-results/
          retention-days: 14
      - name: Stop the PX4 fleet
        if: always()
        working-directory: .
        run: docker compose -f sim/sitl/compose.yaml down
