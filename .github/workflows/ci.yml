# Mirrors scripts/check.py, one job per suite so failures are easy to locate.
name: ci

on:
  push:
    branches: [main, "exp/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboard:
    name: onboard swarm_sar (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --no-project --with-requirements requirements-standalone.txt python -m pytest -q

  fleet-service:
    name: fleet-service (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: fleet-service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Install nats-server (pinned, checksum verified) for the NATS tests
        working-directory: .
        run: |
          version=v2.15.0
          sum=5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92
          file=nats-server-$version-linux-amd64.tar.gz
          url=https://github.com/nats-io/nats-server/releases/download/$version/$file
          curl -fsSL -o "$RUNNER_TEMP/$file" "$url"
          echo "$sum  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          bin=$RUNNER_TEMP/nats-server-$version-linux-amd64/nats-server
          echo "NATS_SERVER_BIN=$bin" >> "$GITHUB_ENV"
      - run: uv run ruff check . ../sim
      - run: uv run ruff format --check . ../sim
      - run: uv run ruff check --config ../src/sar_gcs_bridge/ruff.toml ../src/sar_gcs_bridge
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          SARGCS_REQUIRE_NATS: "1"

  fleet-console:
    name: fleet-console
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fleet-console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fleet-console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  images:
    name: container images build
    runs-on: ubuntu-24.04
    needs: [fleet-service, fleet-console]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker compose -f deploy/compose.yaml build
