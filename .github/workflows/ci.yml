# Mirrors scripts/check.py, one job per suite so failures are easy to locate.
name: ci

on:
  push:
    branches: [main, "exp/**", "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboard:
    name: onboard swarm_sar (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --no-project --with-requirements requirements-standalone.txt python -m pytest -q

  fleet-service:
    name: fleet-service (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: fleet-service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Install nats-server (pinned, checksum verified) for the NATS tests
        working-directory: .
        run: |
          version=v2.15.0
          sum=5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92
          file=nats-server-$version-linux-amd64.tar.gz
          url=https://github.com/nats-io/nats-server/releases/download/$version/$file
          curl -fsSL -o "$RUNNER_TEMP/$file" "$url"
          echo "$sum  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          bin=$RUNNER_TEMP/nats-server-$version-linux-amd64/nats-server
          echo "NATS_SERVER_BIN=$bin" >> "$GITHUB_ENV"
      - run: uv run ruff check . ../sim ../fleet-console/e2e ../scripts
      - run: uv run ruff format --check . ../sim ../fleet-console/e2e ../scripts
      - run: uv run ruff check --config ../src/sar_gcs_bridge/ruff.toml ../src/sar_gcs_bridge
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          SARGCS_REQUIRE_NATS: "1"

  fleet-console:
    name: fleet-console
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fleet-console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fleet-console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: console e2e (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fleet-console
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        working-directory: fleet-service
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fleet-console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Offline basemap sample (cached)
        uses: actions/cache@v4
        with:
          path: fleet-console/public/basemap
          key: basemap-${{ hashFiles('fleet-console/scripts/fetch-basemap.mjs', 'fleet-console/scripts/regions.json') }}
      - name: Fetch the basemap if not cached
        run: |
          if [ ! -f public/basemap/index.json ]; then
            version=v1.31.2
            sum=3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
            file=go-pmtiles_1.31.2_Linux_x86_64.tar.gz
            curl -fsSL -o "$RUNNER_TEMP/$file" \
              "https://github.com/protomaps/go-pmtiles/releases/download/$version/$file"
            echo "$sum  $RUNNER_TEMP/$file" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" pmtiles
            PMTILES_BIN="$RUNNER_TEMP/pmtiles" node scripts/fetch-basemap.mjs --region zurich
          fi
      - name: Mock video relay (sim/video, M5)
        working-directory: .
        run: |
          docker compose -f sim/video/compose.yaml up -d --build
          python3 sim/video/check.py --streams 4 --timeout 120
      - name: Video relay integration tests (the fleet service against MediaMTX)
        working-directory: fleet-service
        env:
          SARGCS_VIDEO: "1"
        run: uv run pytest -m video tests/integration/test_video_relay.py -v -p no:cacheprovider
      - name: E2E tests
        env:
          UV: uv
          E2E_VIDEO: "1"
        run: npx playwright test
      - name: Results as annotations (readable without signing in)
        if: always()
        working-directory: .
        run: |
          mkdir -p e2e-results
          cp fleet-console/test-results/junit.xml e2e-results/ 2>/dev/null || true
          python3 sim/sitl/annotate.py e2e-results
          if [ -f fleet-console/test-results/perf.json ]; then
            echo "::notice title=Map performance (CI, software WebGL)::$(tr -d '\n' < fleet-console/test-results/perf.json)"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results
          path: |
            fleet-console/test-results/
            fleet-console/playwright-report/
          retention-days: 14

  images:
    name: container images, field stack smoke test
    runs-on: ubuntu-24.04
    needs: [fleet-service, fleet-console]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker compose -f deploy/compose.yaml build
      # The stack as in the field: gateway and TLS, relay access control, read-only
      # roots, audit and backup (M6).
      - run: deploy/smoke.sh
