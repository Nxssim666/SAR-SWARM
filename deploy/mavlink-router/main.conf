# Sample mavlink-router configuration for a field ground station (ADR 0022). UNVERIFIED:
# no test exercises it; adapt the radio device and addresses to the station.
#
# One telemetry radio carries the whole fleet. mavlink-router fans it out to:
#   - the fleet service, which listens on udpin://0.0.0.0:14550 and tells the aircraft
#     apart by MAVLink system id (register each aircraft with that connection and its id);
#   - a backup QGroundControl for the safety pilot, which connects to this host on 14560.
#
#   mavlink-routerd -c /etc/mavlink-router/main.conf

[General]
TcpServerPort = 0
ReportStats = false

[UartEndpoint radio]
Device = /dev/ttyUSB0
Baud = 57600

[UdpEndpoint fleet-service]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint qgroundcontrol]
Mode = Server
Address = 0.0.0.0
Port = 14560
