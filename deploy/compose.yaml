# Field ground station: `docker compose -f deploy/compose.yaml up -d --build`.
# PX4 SITL, the swarm simulation and mock video are in sim/.
name: sar-gcs

services:
  fleet-service:
    build: ../fleet-service
    image: sar-gcs/fleet-service:dev
    restart: unless-stopped
    environment:
      SARGCS_STATION_NAME: ${SARGCS_STATION_NAME:-ground-station-1}
      SARGCS_LOG_LEVEL: ${SARGCS_LOG_LEVEL:-INFO}
      # Only the gateway can reach this service, so trust its X-Forwarded-For: audit
      # events then record the operator device's address, not the gateway's.
      FORWARDED_ALLOW_IPS: "*"
      # The swarm bridge's broker (ADR 0024); unset SARGCS_NATS_URL to run without swarms.
      SARGCS_NATS_URL: ${SARGCS_NATS_URL:-nats://nats:4222}
      # The video relay (ADR 0012): stream health, and the paths of registered streams.
      SARGCS_MEDIAMTX_API_URL: http://mediamtx:9997
    # First admin (once, after `up`):
    #   docker compose -f deploy/compose.yaml exec fleet-service fleet-service create-admin --username chief
    volumes:
      - fleet-data:/data
    expose:
      - "8000"
    # MAVLink from the radio (through mavlink-router on the host, see mavlink-router/main.conf):
    # register aircraft with mavlink_connection udpin://0.0.0.0:14550 (ADR 0022).
    ports:
      - "14550:14550/udp"

  # The broker between the fleet service and the swarm bridge (ADR 0024). The bridge
  # (sim/swarm/Dockerfile, sar_gcs_bridge) runs on the host network next to the swarm's
  # radio and connects to 127.0.0.1:4222; nothing else is exposed.
  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    command: ["-p", "4222"]
    ports:
      - "127.0.0.1:4222:4222"

  # The video relay (ADR 0012, ADR 0034): the same pinned MediaMTX release as sim/video.
  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg@sha256:00ef3d1a243f3769ca36769b47df241a0c269c83a7735005b817505c49adb651
    restart: unless-stopped
    environment:
      # The station's LAN address(es), comma-separated, as WebRTC candidates for browsers.
      MTX_WEBRTCADDITIONALHOSTS: ${SARGCS_SITE_ADDRESS:-localhost}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    expose:
      - "9997" # API, for the fleet service
      - "8889" # WHEP signalling, behind the gateway
      - "8888" # LL-HLS, behind the gateway
    ports:
      - "8554:8554" # RTSP ingest (cameras that push)
      - "8890:8890/udp" # SRT ingest (lossy links)
      - "8189:8189/udp" # WebRTC media to operator devices

  # Caddy: serves the console, proxies the API, terminates TLS with its internal CA (no Internet).
  console:
    build: ../fleet-console
    image: sar-gcs/fleet-console:dev
    restart: unless-stopped
    depends_on:
      fleet-service:
        condition: service_healthy
    environment:
      SARGCS_SITE_ADDRESS: ${SARGCS_SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  fleet-data:
  caddy-data:
