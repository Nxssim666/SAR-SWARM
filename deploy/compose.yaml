# Field ground station: `docker compose -f deploy/compose.yaml up -d --build`.
# NATS (M2), MediaMTX (M5) and the simulation profiles (M2) are added in their milestones.
name: sar-gcs

services:
  fleet-service:
    build: ../fleet-service
    image: sar-gcs/fleet-service:dev
    restart: unless-stopped
    environment:
      SARGCS_STATION_NAME: ${SARGCS_STATION_NAME:-ground-station-1}
      SARGCS_LOG_LEVEL: ${SARGCS_LOG_LEVEL:-INFO}
    volumes:
      - fleet-data:/data
    expose:
      - "8000"

  # Caddy: serves the console, proxies the API, terminates TLS with its internal CA (no Internet).
  console:
    build: ../fleet-console
    image: sar-gcs/fleet-console:dev
    restart: unless-stopped
    depends_on:
      fleet-service:
        condition: service_healthy
    environment:
      SARGCS_SITE_ADDRESS: ${SARGCS_SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  fleet-data:
  caddy-data:
