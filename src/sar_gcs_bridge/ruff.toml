# The bridge follows the onboard ROS style (ament flake8 + pep257, single quotes, 99
# columns), which colcon test checks in the ROS container; ruff checks the same locally.
# Ignored docstring rules are ament_pep257's defaults.
line-length = 99

[lint]
select = ["E", "W", "F", "D", "Q", "B"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D203", "D212", "D404"]

[lint.flake8-quotes]
inline-quotes = "single"
