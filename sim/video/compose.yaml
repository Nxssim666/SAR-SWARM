# Mock video (ADR 0012, ADR 0017): MediaMTX with four test streams, one per aircraft,
# generated by the ffmpeg bundled in the image (testsrc2, 640x360, 15 fps, H.264), with the
# path, wall-clock time and frame number burned in.
# Sim tooling only; the product's video integration is M5.
#
#   docker compose -f sim/video/compose.yaml up -d      # Linux with Docker only
#   python3 sim/video/check.py --streams 4              # waits until all are ready
#
# RTSP rtsp://127.0.0.1:8554/aircraft-01..04, WebRTC (WHEP) http://127.0.0.1:8889/<path>/whep,
# LL-HLS http://127.0.0.1:8888/<path>/index.m3u8,
# API http://127.0.0.1:9997/v3/paths/list.
name: sar-video

services:
  mediamtx:
    build: .  # the pinned MediaMTX image plus a font for the overlay (Dockerfile)
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
